# ==========================================
# Application
# ==========================================
spring.application.name=stylecart-backend

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# MySQL Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/stylecart_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Redis Configuration
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# Logging
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# SpringDoc OpenAPI / Swagger
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.microservices.stylecartbackend
springdoc.paths-to-match=/**

#########################################
# JWT Configuration
#########################################

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000